name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Laravel CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      APP_ENV: testing
      APP_DEBUG: true

      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite

      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --no-scripts \
            --no-cache

      - name: Create Laravel runtime directories
        run: |
          mkdir -p database
          mkdir -p storage/app/public
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/testing
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

          touch database/database.sqlite
          touch storage/logs/laravel.log

          chmod -R u+rwX,g+rwX storage
          chmod -R u+rwX,g+rwX bootstrap/cache
          chmod -R u+rwX,g+rwX database

      - name: Prepare environment
        run: |
          cp .env.example .env

          php artisan key:generate --ansi
          php artisan config:clear
          php artisan cache:clear
          php artisan view:clear

      - name: Discover Laravel packages
        run: composer run-script post-autoload-dump

      - name: Run database migrations
        run: php artisan migrate:fresh --force --ansi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Run CI checks
        run: composer ci:check